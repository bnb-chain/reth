# Documentation jobs.

name: book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  merge_group:

env:
  RUSTC_WRAPPER: "sccache"
  PINNED_NIGHTLY: nightly-2026-01-22

jobs:
  build:
    runs-on: ${{ github.repository == 'paradigmxyz/reth' && 'depot-ubuntu-latest-8' || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 90
    env:
      # Include the system trust store containing Aegis's CA for Bun and Node.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - name: Checkout
        uses: actions/checkout@v6

      - run: .github/scripts/install_llvm.sh ubuntu

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: v1.2.23

      - name: Install Playwright browsers
        # Required for rehype-mermaid to render Mermaid diagrams during build
        run: |
          cd docs/vocs/
          bun i
          npx playwright install --with-deps chromium

      - name: Install Rust nightly
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config libclang-dev
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: nightly

      - name: Build docs
        run: cd docs/vocs && bash scripts/build-cargo-docs.sh

      - name: Build Vocs
        run: |
          cd docs/vocs/ && bun run build
          test -f docs/dist/public/index.html
          test -f docs/dist/public/overview/index.html
          test -f docs/dist/public/sdk/index.html
          test -f docs/dist/public/logo.png
          test -f docs/dist/public/reth-prod.png
          test -f docs/dist/public/docs/index.html
          test -f docs/dist/public/docs/reth/index.html
          test -d docs/dist/public/docs/static.files
          grep -q 'content="rustdoc"' docs/dist/public/docs/index.html
          echo "Vocs Build Complete"

      # - name: Setup Pages
      #   uses: actions/configure-pages@v5

      # - name: Upload artifact
      #   uses: actions/upload-pages-artifact@v4
      #   with:
      #     path: "./docs/vocs/docs/dist"

  # deploy:
  #   # Only deploy if a push to main
  #   if: github.ref_name == 'main' && github.event_name == 'push'
