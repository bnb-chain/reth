# Documentation and mdbook related jobs.

name: book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  merge_group:

env:
  RUSTC_WRAPPER: "sccache"
  PINNED_NIGHTLY: nightly-2026-07-23

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - run: .github/scripts/install_llvm.sh ubuntu

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: v1.2.23

      - name: Install Playwright browsers
        # Required for rehype-mermaid to render Mermaid diagrams during build
        run: |
          cd docs/vocs/
          bun i
          npx playwright install --with-deps chromium

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.PINNED_NIGHTLY }}

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config libclang-dev

      - name: Build docs
        run: cd docs/vocs && bash scripts/build-cargo-docs.sh

      - name: Build Vocs
        run: |
          cd docs/vocs/ && bun run build
          test -f docs/dist/public/index.html
          test -f docs/dist/public/overview/index.html
          test -f docs/dist/public/sdk/index.html
          test -f docs/dist/public/logo.png
          test -f docs/dist/public/reth-prod.png
          test -f docs/dist/public/docs/index.html
          test -f docs/dist/public/docs/reth/index.html
          test -d docs/dist/public/docs/static.files
          grep -q 'content="rustdoc"' docs/dist/public/docs/index.html
          echo "Vocs Build Complete"

